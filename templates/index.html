<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SummerTECH-CAMP 2026 音声対話システム</title>
<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
<header class="topbar">
  <h1>🎤 音声対話システム <span class="sub">SummerTECH-CAMP 2026</span></h1>
  <a class="settings-link" href="/settings">⚙️ APIキー設定</a>
</header>

<main class="container">
  <!-- 左パネル：設定 -->
  <aside class="panel side-panel">
    <section class="card">
      <h2>🤖 AIの設定</h2>
      <label for="provider-select">使うAI</label>
      <select id="provider-select">
        {% for key, p in providers.items() %}
        <option value="{{ key }}">{{ p.label }}</option>
        {% endfor %}
      </select>

      <label for="model-select">モデル</label>
      <select id="model-select"></select>
    </section>

    <section class="card">
      <h2>📝 プロンプト（AIへの指示）</h2>
      <p class="hint">AIの性格や話し方を自由に書いてみよう！</p>
      <textarea id="system-prompt" rows="8">あなたは高校生と楽しく会話するアシスタントです。返事は50文字以内で短く、親しみやすく話してください。</textarea>
    </section>

    <section class="card">
      <h2>🔊 声の設定</h2>
      <label for="tts-select">音声合成エンジン</label>
      <select id="tts-select">
        <option value="voicevox">VOICEVOX（ずんだもん等）</option>
        <option value="gtts">gTTS（Google翻訳の声）</option>
        <option value="none">読み上げなし</option>
      </select>

      <div id="voicevox-speaker-row">
        <label for="speaker-select">VOICEVOXの話者</label>
        <select id="speaker-select">
          <option value="3">ずんだもん（ノーマル）</option>
          <option value="1">四国めたん（あまあま）</option>
          <option value="2">四国めたん（ノーマル）</option>
          <option value="8">春日部つむぎ</option>
          <option value="14">冥鳴ひまり</option>
        </select>
      </div>
    </section>

    <section class="card">
      <button id="reset-button" class="btn btn-danger">🗑️ 会話をリセット</button>
    </section>
  </aside>

  <!-- 右パネル：会話 -->
  <section class="panel chat-panel">
    <div id="chat-area" class="chat-area">
      <div class="welcome-message">
        マイクボタン🎤を押して話しかけるか、下の入力欄からメッセージを送ってみよう！
      </div>
    </div>

    <!-- 音声認識の途中結果をリアルタイム表示 -->
    <div id="interim-area" class="interim-area" hidden>
      <span class="interim-label">認識中…</span>
      <span id="interim-text"></span>
    </div>

    <div id="status-bar" class="status-bar"></div>

    <div class="input-area">
      <button id="mic-button" class="btn btn-mic" title="マイクON/OFF">🎤 マイクON</button>
      <input id="text-input" type="text" placeholder="次の発話を入力（Enterで送信）" autocomplete="off">
      <button id="send-button" class="btn btn-send">送信</button>
    </div>
  </section>
</main>

<script>
  // サーバーから渡されたAI・モデル一覧
  const AI_PROVIDERS = {{ providers | tojson }};
</script>
<script src="{{ url_for('static', filename='app.js') }}"></script>
</body>
</html>
